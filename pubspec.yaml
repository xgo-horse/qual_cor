name: qual_cor
description: "Qual cor? Diz o nome da cor de um ponto numa foto ou na câmera, para auxiliar daltônicos."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  app_settings: ^9.0.1
  camera: ^0.12.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^9.0.0
  image: ^4.12.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  material_ui: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true

# Ícone e tela de abertura: gerados a partir de assets/icon/ (criados por
# tool/make_icon.dart). Para regenerar:
#   dart run tool/make_icon.dart
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  ios: true
  android: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  background_color_ios: "#E9E8E4"
  adaptive_icon_background: "#E9E8E4"
  adaptive_icon_foreground: assets/icon/foreground.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#E9E8E4"
  image: assets/icon/splash.png
  android_12:
    color: "#E9E8E4"
    image: assets/icon/splash.png
  ios: true
  android: true
  web: false
