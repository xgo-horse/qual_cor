name: qual_cor
description: "Qual cor? Diz o nome da cor de um ponto numa foto ou na câmera, para auxiliar daltônicos."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  app_settings: ^9.0.1
  camera: ^0.12.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^9.0.0
  image: ^4.12.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  material_ui: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true
