name: qual_cor
description: "Qual cor? Diz o nome da cor de um ponto numa foto ou na câmera, para auxiliar daltônicos."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  app_settings: ^9.0.1
  camera: ^0.12.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.4
  intl: ^0.20.3
  material_ui: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  generate: true
  uses-material-design: true

  # Licenças das fontes (aparecem em Sobre > Licenças, via lib/licenses.dart).
  assets:
    - assets/licenses/

  # Fontes embutidas (variáveis; o peso vai por FontVariation 'wght').
  # Fonte: github.com/google/fonts, licença SIL OFL 1.1.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
        - asset: assets/fonts/Fraunces-Italic.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf

# Ícone e tela de abertura: gerados a partir de assets/icon/ (criados por
# tool/make_icon.dart). Os geradores NÃO ficam como dependência porque o
# Flutter põe na tela de licenças do app todo pacote do pubspec, inclusive
# os de desenvolvimento (eles trariam 13 pacotes à toa). Para regenerar:
#   flutter pub add --dev flutter_launcher_icons flutter_native_splash
#   dart run tool/make_icon.dart
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
#   (confira se o projeto do Xcode não ganhou
#   ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS = AppIcon;
#   o certo é YES)
#   flutter pub remove flutter_launcher_icons flutter_native_splash
flutter_launcher_icons:
  ios: true
  android: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  background_color_ios: "#E9E8E4"
  adaptive_icon_background: "#E9E8E4"
  adaptive_icon_foreground: assets/icon/foreground.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#E9E8E4"
  image: assets/icon/splash.png
  android_12:
    color: "#E9E8E4"
    image: assets/icon/splash.png
  ios: true
  android: true
  web: false
